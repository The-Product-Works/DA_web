services:
  metabase:
    image: metabase/metabase:latest
    container_name: olist-metabase
    ports:
      - "3000:3000"
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
    volumes:
      - olist_metabase_data:/metabase-data
    restart: unless-stopped

volumes:
  olist_metabase_data:
